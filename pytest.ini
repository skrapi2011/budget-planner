# Pytest config for the backend suite. `python -m pytest` from the repo root runs
# backend/tests; conftest.py puts backend/ on sys.path and sets DATABASE_PATH to a temp
# file before App.py is imported (init_db() runs at import — AGENTS.md §3).
[pytest]
testpaths = backend/tests
python_files = test_*.py
addopts = -q --disable-warnings
