name: CI

# Runs on every pull request into main, on every merge to main, and on demand.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: this workflow only reads the repo.
permissions:
  contents: read

# A new push to the same PR/branch cancels the in-flight run (saves runner minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the local dev version (AGENTS.md §1). No 3.14-only syntax in the
          # suite, so 3.13 also passes if the runner image lacks 3.14.
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      # conftest.py sets DATABASE_PATH to a temp file BEFORE importing App.py, which is
      # the only safe place to import it (init_db() runs at module level, AGENTS.md §3).
      - name: Run backend tests
        run: python -m pytest backend/tests

  frontend:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Vite 8 / Vitest 5 need Node 20.19+ or 22.12+; 22 is the safe pin.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # npm ci (not npm install): the lockfile is committed, so the tree is reproducible.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # The animation assertions run on FAKE timers (see src/test/setup.js + settle() in
      # src/test/renderPage.jsx), so they do not depend on how fast the runner fires rAF.
      # --retry=1 stays as a safety net for any remaining timing-sensitive case; a retry that
      # fails twice is a real regression, not runner jitter.
      - name: Unit tests
        run: npm test -- --retry=1

      - name: Build
        run: npm run build

      # Artefact: the built SPA, so a PR's output can be inspected without a local checkout.
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # A single check name to require in branch protection: "CI / summary".
  # Both suites must be green for it to go green.
  summary:
    name: CI summary
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Report
        run: |
          backend="${{ needs.backend.result }}"
          frontend="${{ needs.frontend.result }}"
          echo "## CI result" >> $GITHUB_STEP_SUMMARY
          echo "- backend (pytest): $backend" >> $GITHUB_STEP_SUMMARY
          echo "- frontend (lint + vitest + build): $frontend" >> $GITHUB_STEP_SUMMARY
          if [ "$backend" != "success" ] || [ "$frontend" != "success" ]; then
            echo "## ❌ one or more suites failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "## ✅ all suites green" >> $GITHUB_STEP_SUMMARY
